name: Verify template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install regex search dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Dependency policy
        run: bun test tools/mcp-runtime-policy.test.ts
      - name: MCP integration, transports, and OAuth
        run: bun run tools/mcp-wiki-server/test.ts
      - name: Content contract
        run: |
          bun run tools/wiki_health.ts --json
          bun run tools/wiki_tags.ts validate --strict --json
          bun run tools/wiki_lint.ts --json
      - name: No changes or dependencies in the vault
        run: |
          git diff --exit-code
          test -z "$(find . -type d -name node_modules -print -quit)"
