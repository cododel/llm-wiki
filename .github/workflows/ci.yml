name: Verify service

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install regex search dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Verify service
        run: bun run tools/verify.ts
      - name: No source changes or local dependencies
        run: |
          git diff --exit-code
          test -z "$(find . -type d -name node_modules -print -quit)"
